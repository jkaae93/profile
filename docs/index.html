<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Pages Site</title>
    <meta name="description" content="Deployed via GitHub Pages" />
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 0; padding: 2rem; line-height: 1.5; }
      .container { max-width: 840px; margin: 0 auto; }
      h1 { font-size: 2rem; margin-bottom: 0.5rem; }
      p { margin: 0.5rem 0; }
      a { color: #0969da; }
      code { background: rgba(128,128,128,.15); padding: .15rem .35rem; border-radius: .3rem; }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>It works! 🎉</h1>
      <p>This site is served from the <code>docs/</code> folder on the <code>main</code> branch via GitHub Pages.</p>
      <p>Edit <code>docs/index.html</code> and push to update.</p>
      <hr />
      <p>
        Tips:
        <ul>
          <li>For single-page apps, add a <code>404.html</code> that redirects to <code>index.html</code>.</li>
          <li>If you use directories starting with underscores, keep <code>.nojekyll</code> in <code>docs/</code>.</li>
        </ul>
      </p>
    </main>
  </body>
</html>
